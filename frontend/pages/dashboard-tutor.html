<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel del tutor — Tutores On-Line</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>
<a href="#main-content" class="skip-link">Saltar al contenido principal</a>
<header class="site-header" id="site-header"></header>

<main id="main-content">
  <section class="section section--tight">
    <div class="container">
      <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
          <div class="profile-mini">
            <span class="avatar-circle" id="side-avatar"></span>
            <h3 id="side-nombre" style="margin:.5rem 0 0;"></h3>
            <p class="text-muted" id="side-email" style="font-size:var(--fs-sm);"></p>
          </div>
          <nav class="dashboard-nav">
            <button data-tab="solicitudes" class="active">📨 Solicitudes <span id="badge-pendientes"></span></button>
            <button data-tab="agenda">🗓️ Mi disponibilidad</button>
            <button data-tab="historial">📚 Historial de tutorias</button>
            <button data-tab="perfil">👤 Mi perfil</button>
            <button data-tab="notificaciones">🔔 Notificaciones <span id="badge-notif"></span></button>
          </nav>
        </aside>

        <div>
          <div class="stat-grid">
            <div class="stat-card"><div class="value" id="stat-pendientes">0</div><div class="label">Solicitudes pendientes</div></div>
            <div class="stat-card"><div class="value" id="stat-aceptadas">0</div><div class="label">Proximas sesiones</div></div>
            <div class="stat-card"><div class="value" id="stat-calificacion">0</div><div class="label">Calificacion promedio</div></div>
            <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Tutorias totales</div></div>
          </div>

          <section id="tab-solicitudes" class="tab-panel">
            <div class="panel">
              <h3>Solicitudes pendientes</h3>
              <div id="solicitudes-wrap"></div>
            </div>
          </section>

          <section id="tab-agenda" class="tab-panel" style="display:none;">
            <div class="panel">
              <h3>Agregar franja de disponibilidad</h3>
              <form id="form-disponibilidad" class="form-row" style="align-items:end;">
                <div class="field">
                  <label for="d-dia">Dia</label>
                  <select id="d-dia" required>
                    <option value="LUNES">Lunes</option><option value="MARTES">Martes</option><option value="MIERCOLES">Miercoles</option>
                    <option value="JUEVES">Jueves</option><option value="VIERNES">Viernes</option><option value="SABADO">Sabado</option><option value="DOMINGO">Domingo</option>
                  </select>
                </div>
                <div class="field"><label for="d-inicio">Hora inicio</label><input type="time" id="d-inicio" required /></div>
                <div class="field"><label for="d-fin">Hora fin</label><input type="time" id="d-fin" required /></div>
                <div class="field">
                  <label for="d-modalidad">Modalidad</label>
                  <select id="d-modalidad"><option value="AMBAS">Virtual y presencial</option><option value="VIRTUAL">Virtual</option><option value="PRESENCIAL">Presencial</option></select>
                </div>
                <button type="submit" class="btn btn-primary">Agregar</button>
              </form>
              <div id="disponibilidad-alert"></div>
            </div>
            <div class="panel">
              <h3>Mi disponibilidad actual</h3>
              <div id="agenda-wrap"></div>
            </div>
          </section>

          <section id="tab-historial" class="tab-panel" style="display:none;">
            <div class="panel">
              <h3>Historial de tutorias</h3>
              <div id="historial-wrap"></div>
            </div>
          </section>

          <section id="tab-perfil" class="tab-panel" style="display:none;">
            <div class="panel">
              <h3>Mi perfil publico</h3>
              <form id="form-perfil" class="form-grid">
                <div class="field"><label for="p-bio">Biografia</label><textarea id="p-bio" maxlength="500"></textarea></div>
                <div class="form-row">
                  <div class="field"><label for="p-tarifa">Tarifa por hora (COP)</label><input type="number" id="p-tarifa" min="0" step="1000" /></div>
                  <div class="field"><label for="p-modalidad">Modalidad</label>
                    <select id="p-modalidad"><option value="AMBAS">Virtual y presencial</option><option value="VIRTUAL">Virtual</option><option value="PRESENCIAL">Presencial</option></select>
                  </div>
                </div>
                <div class="field"><label for="p-ciudad">Ciudad</label><input type="text" id="p-ciudad" /></div>
                <button type="submit" class="btn btn-primary" style="width:fit-content;">Guardar cambios</button>
              </form>
            </div>
          </section>

          <section id="tab-notificaciones" class="tab-panel" style="display:none;">
            <div class="panel">
              <h3>Notificaciones</h3>
              <div id="notif-wrap"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal-backdrop" id="modal-rechazar">
  <div class="modal">
    <button class="modal-close" id="cerrar-modal-rechazo" aria-label="Cerrar">&times;</button>
    <h3>Rechazar solicitud</h3>
    <form id="form-rechazo" class="form-grid">
      <input type="hidden" id="rech-id-reserva" />
      <div class="field">
        <label for="rech-motivo">Motivo (se enviara al estudiante)</label>
        <textarea id="rech-motivo" maxlength="300" placeholder="Ej: No tengo disponibilidad ese dia." required></textarea>
      </div>
      <button type="submit" class="btn btn-danger btn-block">Confirmar rechazo</button>
    </form>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/data/local-provider.js"></script>
<script src="../assets/js/data/api-provider.js"></script>
<script src="../assets/js/data/index.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/dashboard-tutor.js"></script>
</body>
</html>
